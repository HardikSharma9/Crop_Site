{% extends "base.html" %}
{% load static %}

{% block title %} Manage Users {% endblock %}

{% block content %}
<div class="text-center">
    <h3 class="mb-3"><i class="fa-solid fa-users"></i>
        Registered Users
    </h3>
    <table class="table table-striped table-hover">
      <thead class="table-success">
        <tr>
            <th>Serial No.</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        
        </tr>
      </thead>
      <tbody>
        {% for i in users %}
             <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.get_full_name}}</td>
            <td>{{i.username}}</td>
            <td>{{i.userprofile.phone}}</td>
            
            <td><a href="{% url 'admin_user_delete' i.id %}" class="btn btn-outline-danger"onclick="return confirm('Delete this User? This cannot be undone')">
                <i class="fa-solid fa-trash"></i>
            </a></td>
        
        </tr>
        {% endfor %}
      </tbody>
    
    </table>
</div>

{% endblock %}
